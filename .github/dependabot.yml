version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "npm"
    groups:
      react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      tooling:
        patterns:
          - typescript
          - eslint
          - "@types/*"
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
